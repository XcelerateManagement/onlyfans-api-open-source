# Mechanically enforces the claims the project makes about itself:
# no telemetry, no licence check, no metering, no hardcoded production defaults.
#
# These are promises made on theonlyapi.com/open-source and in the README, where
# readers are invited to verify them with grep. This workflow is what stops a
# future merge from the private tree quietly making them untrue.

name: no-phone-home

permissions:
  contents: read

concurrency:
  group: no-phone-home-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Source files only. The README and ARCHITECTURE.md deliberately quote these
      # identifiers — the README invites readers to run this very grep — so
      # matching Markdown would make the guard fail on its own documentation.
      - name: No metering or slot-counting code
        run: |
          if grep -rInE 'count_api_call|check_and_reserve_slot|api_limits|usage_tracker' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github \
               --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' . ; then
            echo "::error::Metering code found. The open-source build has no metering layer."
            exit 1
          fi
          echo "OK — no metering code."

      - name: No calls to company infrastructure
        run: |
          # Docs and licence files may name the hosted product; code may not.
          if grep -rInE 'theonlyapi\.com|xcelerator\.agency|xcelerator\.run|ofdashboard' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github \
               --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' . ; then
            echo "::error::Source references company infrastructure. Self-hosted installs must never call home."
            exit 1
          fi
          echo "OK — no company hostnames in source."

      - name: No production-derived identifiers
        run: |
          if grep -rInE 'crm_[0-9a-f]{16,}' api \
               --include='*.py' --exclude-dir=tests; then
            echo "::error::A production-shaped CRM identifier was found in application source."
            exit 1
          fi

          python - <<'PY'
          import ipaddress
          import pathlib
          import re

          path = pathlib.Path("api/tests/test_account_security.py")
          documentation_networks = tuple(map(ipaddress.ip_network, (
              "192.0.2.0/24",
              "198.51.100.0/24",
              "203.0.113.0/24",
          )))
          violations = []
          for line_number, line in enumerate(path.read_text().splitlines(), 1):
              for value in re.findall(r"(?<![\d.])(?:\d{1,3}\.){3}\d{1,3}(?![\d.])", line):
                  try:
                      address = ipaddress.ip_address(value)
                  except ValueError:
                      continue
                  if address.is_loopback or any(address in network for network in documentation_networks):
                      continue
                  violations.append(line_number)

          if violations:
              lines = ", ".join(map(str, sorted(set(violations))))
              raise SystemExit(
                  f"Potentially routable IP fixture found in account-security test at line(s): {lines}"
              )
          print("OK — account-security fixtures use documentation-only addresses.")
          PY

      - name: Single-worker constraint intact
        run: |
          if ! grep -q 'GUNICORN_WORKERS' api/gunicorn.conf.py; then
            echo "::error::gunicorn.conf.py no longer guards GUNICORN_WORKERS."
            exit 1
          fi
          echo "OK — single-worker guard present."
