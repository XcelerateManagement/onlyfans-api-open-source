name: Bug report
description: Something is reproducibly wrong
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **If your install will not start**, the
        [Telegram group](https://t.me/+og_d0ZLaWEdjZGQ5) and
        [SELF-HOSTING.md § Troubleshooting](https://github.com/xcelerate-management/onlyfans-api-open-source/blob/main/SELF-HOSTING.md#troubleshooting)
        will get you an answer far faster than this form.

        **Redact before you paste.** No creator usernames, `crm_id`s, platform user
        IDs, fan identifiers, message bodies or API keys.

  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - Local docker compose
        - Bare VPS via install.sh
        - Coolify / Dokploy / CapRover / Easypanel
        - Render
        - Fly.io
        - Railway
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Release or commit
      placeholder: "v0.1.0, or the commit SHA"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs api --tail=200`, redacted."
      render: text
    validations:
      required: true

  - type: input
    id: health
    attributes:
      label: /health and /ready
      description: "`curl -s -o /dev/null -w '%{http_code}' localhost:5000/health` and the same for /ready. If /ready is 503, paste the body — it names the failing component."
      placeholder: "health 200, ready 503 (scheduler)"

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: I have redacted creator usernames, crm_ids, fan data, message content and API keys.
          required: true
        - label: My platform is not on the "will not work" list in SELF-HOSTING.md.
          required: true
