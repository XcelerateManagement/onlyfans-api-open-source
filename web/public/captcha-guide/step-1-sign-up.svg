<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc">
  <title id="title">Create a 2captcha account</title>
  <desc id="desc">Illustrated browser screen showing the 2captcha registration form with email, password, terms checkbox, and Create account button.</desc>
  <rect width="880" height="480" fill="#080b14"/>
  <rect x="22" y="22" width="836" height="436" rx="12" fill="#f7f8fb" stroke="#273044" stroke-width="2"/>
  <path d="M22 64h836" stroke="#d8deea" stroke-width="2"/>
  <circle cx="48" cy="43" r="6" fill="#ff5f57"/><circle cx="69" cy="43" r="6" fill="#febc2e"/><circle cx="90" cy="43" r="6" fill="#28c840"/>
  <rect x="132" y="32" width="570" height="23" rx="11" fill="#e7ebf2"/>
  <text x="154" y="48" font-family="Arial, sans-serif" font-size="12" fill="#5d6678">2captcha.com/auth/register</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#2563eb">2CAPTCHA</text>
  <text x="495" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Create your account</text>
  <text x="330" y="157" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#374151">EMAIL</text>
  <rect x="330" y="168" width="330" height="46" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="347" y="197" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">you@example.com</text>
  <text x="330" y="241" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#374151">PASSWORD</text>
  <rect x="330" y="252" width="330" height="46" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="347" y="281" font-family="Arial, sans-serif" font-size="18" fill="#9ca3af">••••••••••••</text>
  <rect x="330" y="323" width="18" height="18" rx="3" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <path d="m334 331 4 4 8-10" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="359" y="337" font-family="Arial, sans-serif" font-size="12" fill="#475569">I agree to the Terms of Service and Privacy Policy</text>
  <rect x="330" y="365" width="330" height="48" rx="6" fill="#2563eb"/>
  <text x="495" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">CREATE ACCOUNT</text>
  <circle cx="690" cy="387" r="24" fill="#f54900"/>
  <text x="690" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">1</text>
  <path d="M672 378 650 368" stroke="#f54900" stroke-width="3"/>
  <text x="690" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#f54900">CLICK CREATE ACCOUNT</text>
</svg>
